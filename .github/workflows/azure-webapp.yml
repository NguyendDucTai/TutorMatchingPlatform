name: Deploy .NET 10 API to Azure Web App

on:
  push:
    branches:
      - develop
      - master
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore TutorPlatform.slnx

      - name: Build with Release configuration
        run: dotnet build TutorPlatform.slnx --configuration Release --no-restore

      - name: Publish .NET Web API
        run: dotnet publish TutorPlatform.API/TutorPlatform.API.csproj -c Release -o ${{ github.workspace }}/publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'tutorplatform'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ github.workspace }}/publish
